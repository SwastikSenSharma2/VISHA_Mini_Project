<!DOCTYPE html>
<html lang="en">
<head>

  <title>MedMap — Interactive Incident Location & Mapping System</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --subtle: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --orange: #ea580c;
      --green: #16a34a;
      --grey: #64748b;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Top Navigation Bar */
    .topbar {
      height: 58px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.98rem; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--blue); color: #fff;
      display: grid; place-items: center; font-weight: 800;
    }
    .nav { display: flex; gap: 4px; overflow-x: auto; }
    .nav button {
      border: none; background: transparent; padding: 7px 12px; border-radius: 8px;
      font-size: 0.86rem; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .nav button.active { background: var(--blue-soft); color: var(--blue); }
    .profile-pill {
      background: var(--subtle); padding: 5px 12px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: #334155;
    }

    /* Layout & Views */
    .view { display: none; }
    .view.active { display: block; }

      width: 225px; background: var(--surface); border-right: 1px solid var(--border);
